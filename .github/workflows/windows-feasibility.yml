name: Windows feasibility observations

# Temporary diagnostic on a throwaway branch, never merged: adds a Claude
# account the way the app does on a fresh Windows 11 machine and records
# each read the add makes. No sign-in starts; the probe stops before the
# vendor's own login would run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Manual request · Claude account add on fresh Windows 11 (diagnostic)
    runs-on: ${{ vars.WINDOWS_CLEAN_RUNNER || 'shell-pc-win11' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Record the machine and fetch the probe
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ev = Join-Path $env:RUNNER_TEMP 'repro-evidence'
          New-Item -ItemType Directory -Force $ev | Out-Null
          "EVIDENCE=$ev" >> $env:GITHUB_ENV
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | ConvertTo-Json | Tee-Object "$ev/machine.json"
          "HOME set: $([bool]$env:HOME); profile has .claude: $(Test-Path (Join-Path $env:USERPROFILE '.claude'))"
          "git on the search path: $([bool](Get-Command git -ErrorAction SilentlyContinue))"
          "Git under Program Files: $(Test-Path 'C:\Program Files\Git'); under LOCALAPPDATA: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Git'))"
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/repro/probe.mjs" -OutFile (Join-Path $env:RUNNER_TEMP 'probe.mjs')
      - name: Install Claude Code with its own Windows installer
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          irm https://claude.ai/install.ps1 | iex
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          "claude.exe at the native installer's place: $(Test-Path $c)"
      - name: Raw client reads with no Git on the machine
        run: |
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          foreach ($a in @('--version', 'auth status --json')) {
            $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $c -ArgumentList $a -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
            "== claude $a -> exit $($p.ExitCode) in $($sw.ElapsedMilliseconds) ms"
            "stdout: $(Get-Content -Raw $o)"
            "stderr: $(Get-Content -Raw $e)"
          }
      - name: Probe A - add the account with no Git on the machine
        run: node (Join-Path $env:RUNNER_TEMP 'probe.mjs') no-git | Tee-Object "$env:EVIDENCE/probe-a-no-git.json"
      - name: Install Git for Windows as the app does (pinned, this person only)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $env:RUNNER_TEMP 'Git-2.56.1-64-bit.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/Git-2.56.1-64-bit.exe' -OutFile $exe
          if ((Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower() -ne 'c330c72e10b408cc39994bfefdb63542b0d93d21699325c3e0bd874af8a5a559') { throw 'the Git download differs from its release' }
          $p = Start-Process $exe -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL','/SP-','/CURRENTUSER' -PassThru -Wait
          "Git installer exit $($p.ExitCode); git.exe: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Git\cmd\git.exe')); bash.exe: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Git\bin\bash.exe'))"
      - name: Raw client reads with that Git's cmd folder on the search path
        run: |
          $env:PATH = (Join-Path $env:LOCALAPPDATA 'Programs\Git\cmd') + ';' + $env:PATH
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $c -ArgumentList 'auth status --json' -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
          "== claude auth status --json -> exit $($p.ExitCode) in $($sw.ElapsedMilliseconds) ms"
          "stdout: $(Get-Content -Raw $o)"
          "stderr: $(Get-Content -Raw $e)"
      - name: Probe B - add the account with Git installed as the app installs it
        run: node (Join-Path $env:RUNNER_TEMP 'probe.mjs') app-git | Tee-Object "$env:EVIDENCE/probe-b-app-git.json"
      - name: Probe C - a stored login file (synthetic, not a real token)
        run: |
          $d = Join-Path $env:USERPROFILE '.claude'; New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d '.credentials.json'
          $exp = [DateTimeOffset]::UtcNow.AddDays(1).ToUnixTimeMilliseconds()
          [IO.File]::WriteAllText($f, "{`"claudeAiOauth`":{`"accessToken`":`"probe-synthetic-not-a-token`",`"expiresAt`":$exp,`"subscriptionType`":`"pro`"}}")
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') synthetic-login-file | Tee-Object "$env:EVIDENCE/probe-c-login-file.json"
          Remove-Item -Force $f
      - name: Probe D - a stored file that holds no Claude login (synthetic)
        run: |
          $f = Join-Path $env:USERPROFILE '.claude\.credentials.json'
          [IO.File]::WriteAllText($f, '{}')
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') empty-login-file | Tee-Object "$env:EVIDENCE/probe-d-empty-file.json"
          Remove-Item -Force $f
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: repro-evidence
          path: ${{ runner.temp }}/repro-evidence
          if-no-files-found: ignore
          retention-days: 3
