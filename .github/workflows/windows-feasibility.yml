name: Windows feasibility observations

# Temporary diagnostic on a throwaway branch, never merged: adds a Claude
# account the way the app does on a fresh Windows 11 machine and records
# each read the add makes. No sign-in starts; the probe stops before the
# vendor's own login would run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Manual request · Claude sign-out then account add on fresh Windows 11 (diagnostic)
    runs-on: ${{ vars.WINDOWS_CLEAN_RUNNER || 'shell-pc-win11' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Record the machine and fetch the probe
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ev = Join-Path $env:RUNNER_TEMP 'repro-evidence'
          New-Item -ItemType Directory -Force $ev | Out-Null
          "EVIDENCE=$ev" >> $env:GITHUB_ENV
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | ConvertTo-Json | Tee-Object "$ev/machine.json"
          "HOME set: $([bool]$env:HOME); profile has .claude: $(Test-Path (Join-Path $env:USERPROFILE '.claude'))"
          "git on the search path: $([bool](Get-Command git -ErrorAction SilentlyContinue))"
          "Git under Program Files: $(Test-Path 'C:\Program Files\Git'); under LOCALAPPDATA: $(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Git'))"
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/repro/probe.mjs" -OutFile (Join-Path $env:RUNNER_TEMP 'probe.mjs')
      - name: Install Claude Code with its own Windows installer
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          irm https://claude.ai/install.ps1 | iex
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          "claude.exe at the native installer's place: $(Test-Path $c)"
      - name: Raw client reads with no Git on the machine
        run: |
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          foreach ($a in @('--version', 'auth status --json')) {
            $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $c -ArgumentList $a -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
            "== claude $a -> exit $($p.ExitCode) in $($sw.ElapsedMilliseconds) ms"
            "stdout: $(Get-Content -Raw $o)"
            "stderr: $(Get-Content -Raw $e)"
          }
      - name: Probe E - a real Claude Code sign-out over a stand-in login that also keeps an MCP server's sign-in
        run: |
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          $d = Join-Path $env:USERPROFILE '.claude'; New-Item -ItemType Directory -Force $d | Out-Null
          $f = Join-Path $d '.credentials.json'
          $exp = [DateTimeOffset]::UtcNow.AddDays(1).ToUnixTimeMilliseconds()
          [IO.File]::WriteAllText($f, "{`"claudeAiOauth`":{`"accessToken`":`"probe-synthetic-not-a-token`",`"refreshToken`":`"probe-synthetic-not-a-token`",`"expiresAt`":$exp,`"scopes`":[`"user:inference`",`"user:profile`"],`"subscriptionType`":`"pro`"},`"mcpOAuth`":{`"probe-server|0`":{`"serverName`":`"probe-server`",`"serverUrl`":`"https://example.invalid/mcp`",`"accessToken`":`"probe-synthetic-not-a-token`",`"expiresAt`":$exp}}}")
          $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
          foreach ($a in @('auth status --json', 'auth logout', 'auth status --json')) {
            $p = Start-Process -FilePath $c -ArgumentList $a -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
            "== claude $a -> exit $($p.ExitCode)"
            "stdout: $(Get-Content -Raw $o)"
            "stderr: $(Get-Content -Raw $e)"
          }
          if (Test-Path $f) { "file left after sign-out; its top-level keys: $(((Get-Content -Raw $f | ConvertFrom-Json).PSObject.Properties.Name) -join ', ')" } else { 'no file left after sign-out' }
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') after-logout-with-mcp | Tee-Object "$env:EVIDENCE/probe-e-after-logout-with-mcp.json"
          if (Test-Path $f) { Remove-Item -Force $f }
      - name: Probe F - a real Claude Code sign-out over a stand-in login alone
        run: |
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          $f = Join-Path $env:USERPROFILE '.claude\.credentials.json'
          $exp = [DateTimeOffset]::UtcNow.AddDays(1).ToUnixTimeMilliseconds()
          [IO.File]::WriteAllText($f, "{`"claudeAiOauth`":{`"accessToken`":`"probe-synthetic-not-a-token`",`"refreshToken`":`"probe-synthetic-not-a-token`",`"expiresAt`":$exp,`"scopes`":[`"user:inference`",`"user:profile`"],`"subscriptionType`":`"pro`"}}")
          $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
          $p = Start-Process -FilePath $c -ArgumentList 'auth logout' -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
          "== claude auth logout -> exit $($p.ExitCode)"
          "stdout: $(Get-Content -Raw $o)"
          "stderr: $(Get-Content -Raw $e)"
          if (Test-Path $f) { "file left after sign-out; its top-level keys: $(((Get-Content -Raw $f | ConvertFrom-Json).PSObject.Properties.Name) -join ', ')" } else { 'no file left after sign-out' }
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') after-logout-alone | Tee-Object "$env:EVIDENCE/probe-f-after-logout-alone.json"
          if (Test-Path $f) { Remove-Item -Force $f }
      - name: Probe G - a real Claude Code sign-out over a stand-in login that also keeps a remote device key
        run: |
          $c = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          $f = Join-Path $env:USERPROFILE '.claude\.credentials.json'
          $exp = [DateTimeOffset]::UtcNow.AddDays(1).ToUnixTimeMilliseconds()
          $k = node -e "process.stdout.write(require('crypto').generateKeyPairSync('ec',{namedCurve:'P-256'}).privateKey.export({type:'pkcs8',format:'der'}).toString('base64'))"
          [IO.File]::WriteAllText($f, "{`"claudeAiOauth`":{`"accessToken`":`"probe-synthetic-not-a-token`",`"refreshToken`":`"probe-synthetic-not-a-token`",`"expiresAt`":$exp,`"scopes`":[`"user:inference`",`"user:profile`"],`"subscriptionType`":`"pro`"},`"coworkRemoteDevice`":{`"probe-device`":{`"privateKeyPkcs8B64`":`"$k`"}}}")
          $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
          $p = Start-Process -FilePath $c -ArgumentList 'auth logout' -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
          "== claude auth logout -> exit $($p.ExitCode)"
          "stdout: $(Get-Content -Raw $o)"
          "stderr: $(Get-Content -Raw $e)"
          if (Test-Path $f) { "file left after sign-out; its top-level keys: $(((Get-Content -Raw $f | ConvertFrom-Json).PSObject.Properties.Name) -join ', ')" } else { 'no file left after sign-out' }
          $p = Start-Process -FilePath $c -ArgumentList 'auth status --json' -NoNewWindow -PassThru -Wait -RedirectStandardOutput $o -RedirectStandardError $e
          "== claude auth status --json -> exit $($p.ExitCode)"
          "stdout: $(Get-Content -Raw $o)"
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') after-logout-with-device-key | Tee-Object "$env:EVIDENCE/probe-g-after-logout-with-device-key.json"
          if (Test-Path $f) { Remove-Item -Force $f }
      - name: Probe H - a login Claude Code itself emptied after Anthropic refused its renewal
        run: |
          $f = Join-Path $env:USERPROFILE '.claude\.credentials.json'
          New-Item -ItemType Directory -Force (Split-Path $f) | Out-Null
          [IO.File]::WriteAllText($f, '{"claudeAiOauth":{"accessToken":"","refreshToken":"","expiresAt":0,"scopes":["user:inference","user:profile"],"subscriptionType":"pro","loginEnded":"time_limit"}}')
          node (Join-Path $env:RUNNER_TEMP 'probe.mjs') emptied-login | Tee-Object "$env:EVIDENCE/probe-h-emptied-login.json"
          Remove-Item -Force $f
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: repro-evidence
          path: ${{ runner.temp }}/repro-evidence
          if-no-files-found: ignore
          retention-days: 3
